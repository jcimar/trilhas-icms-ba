<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ICMS-BA">
<title>Trilhas ICMS-BA 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.hdr{background:#1a1a1a;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hdr-back{font-size:24px;cursor:pointer;display:none;line-height:1;padding-right:4px}
.hdr h1{font-size:16px;font-weight:600;flex:1}
.hdr-sub{font-size:11px;opacity:0.7;margin-top:2px}

/* Home */
.home{padding:14px;flex:1}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rcard{background:#f5f5f5;border-radius:10px;padding:12px}
.rnum{font-size:22px;font-weight:700}
.rlbl{font-size:11px;color:#666;margin-top:2px}

/* Card de trilha na home */
.tcard{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.tcard:active{background:#f9f9f9}
.tcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tid{font-size:11px;font-weight:700;background:#1a1a1a;color:#fff;padding:3px 10px;border-radius:20px}
.th{font-size:11px;color:#666}
.tnome{font-size:15px;font-weight:600;margin-bottom:2px}
.tslots{font-size:11px;color:#666;margin-bottom:8px}
.tmid{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.b-nao{background:#f0f0f0;color:#666}
.b-and{background:#fff3cd;color:#856404}
.b-con{background:#d4edda;color:#155724}
.b-f2{background:#e8f0fb;color:#0c447c}
.pw{display:flex;align-items:center;gap:8px}
.pb{flex:1;height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.pf{height:100%;background:#1a1a1a;border-radius:3px;transition:width 0.3s}
.pt{font-size:11px;color:#666;white-space:nowrap}

/* Tela trilha */
.tscreen{display:none;flex-direction:column;flex:1;overflow:hidden}
.thdr{padding:14px 16px;background:#1a1a1a;color:#fff;flex-shrink:0}
.thdr-nome{font-size:16px;font-weight:700;margin-bottom:2px}
.thdr-slots{font-size:11px;opacity:0.8;margin-bottom:10px}
.pg{display:flex;align-items:center;gap:10px}
.pg .pb{height:8px}
.pg .pt{font-size:13px;font-weight:600;min-width:36px;text-align:right;color:#fff;opacity:1}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid #e0e0e0;background:#fff;flex-shrink:0}
.tab{flex:1;padding:11px;text-align:center;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#1a1a1a;border-bottom-color:#1a1a1a}
.tab.bloq{color:#ccc;cursor:default}

/* Conteúdo scrollável */
.tcontent{overflow-y:auto;flex:1;padding:12px}

/* Grupo (módulo ou bloco) */
.grupo{border:1px solid #e0e0e0;border-radius:12px;margin-bottom:8px;overflow:hidden}
.grupo-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#f8f8f8;user-select:none}
.grupo-hdr:active{background:#f0f0f0}
.grupo-ico{width:28px;height:28px;border-radius:8px;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.grupo-info{flex:1;min-width:0}
.grupo-nome{font-size:13px;font-weight:600;line-height:1.3}
.grupo-sub{font-size:11px;color:#666;margin-top:2px}
.grupo-chev{font-size:16px;color:#999;transition:transform 0.2s;flex-shrink:0}
.grupo-chev.ab{transform:rotate(90deg)}
.grupo-body{display:none;border-top:1px solid #f0f0f0}

/* Item de aula */
.aula{border-bottom:1px solid #f0f0f0;cursor:pointer}
.aula:last-child{border-bottom:none}
.aula-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;background:#fff}
.aula-hdr:active{background:#f9f9f9}
.anum{width:28px;height:28px;border-radius:50%;background:#e8e8e8;color:#666;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.anum.ok{background:#28a745;color:#fff}
.anum.and{background:#ffc107;color:#1a1a1a}
.anum.q{background:#e8f0fb;color:#0c447c}
.aula-info{flex:1;min-width:0}
.atit{font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asub{font-size:10px;color:#888;margin-top:2px;display:flex;gap:5px;align-items:center}
.tbadge{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600;flex-shrink:0}
.tb-t{background:#e8f5e9;color:#27500a}
.tb-q{background:#e8f0fb;color:#0c447c}
.achev{font-size:14px;color:#ddd;flex-shrink:0}
.achev.ab{transform:rotate(90deg);transition:transform 0.2s}

/* Painel da aula */
.apanel{display:none;background:#fafafa;border-top:1px solid #f0f0f0;padding:12px 14px}
.campo{margin-bottom:10px}
.clbl{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px}
.cval{font-size:12px;color:#1a1a1a;line-height:1.5}

/* Registro */
.reg{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-top:8px}
.reg-t{font-size:12px;font-weight:700;margin-bottom:10px}
.rg{margin-bottom:10px}
.rl{font-size:10px;color:#666;margin-bottom:5px}
.ro{display:flex;gap:5px;flex-wrap:wrap}
.rb{font-size:11px;padding:6px 12px;border:1.5px solid #ddd;border-radius:16px;cursor:pointer;background:#fff;color:#1a1a1a;font-weight:500}
.rb.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.mr{display:flex;align-items:center;gap:8px}
.mr input{width:70px;padding:8px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;text-align:center}
.mr input:focus{outline:none;border-color:#1a1a1a}
.ca{width:100%;padding:8px;border:1.5px solid #ddd;border-radius:8px;font-size:12px;font-family:inherit;resize:vertical;min-height:56px}
.ca:focus{outline:none;border-color:#1a1a1a}
.bsalvar{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.bsalvar:active{background:#333}
.msg{text-align:center;color:#28a745;font-size:12px;font-weight:600;padding:6px;display:none}

/* Fase 2 */
.f2panel{padding:14px}
.f2lock{text-align:center;padding:32px 16px}
.f2icon{font-size:44px;margin-bottom:14px}
.f2txt{font-size:13px;color:#666;line-height:1.6;margin-bottom:18px}
.bunlock{width:100%;padding:13px;background:#fff;color:#1a1a1a;border:2px solid #1a1a1a;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.teccard{background:#e8f0fb;border-radius:10px;padding:12px;margin-bottom:8px}
.tectit{font-size:12px;font-weight:700;color:#0c447c;margin-bottom:6px}
.tecbusca{font-size:11px;color:#1a4a8a;background:#fff;border-radius:6px;padding:7px 9px;margin-bottom:8px;font-family:monospace}
.trow{display:flex;gap:8px;margin-top:6px}
.tinput{flex:1;padding:7px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;text-align:center}
.tlbl{font-size:10px;color:#666;text-align:center;margin-top:3px}

.sync{font-size:11px;text-align:center;padding:8px;color:#888}
.sync-ok{color:#28a745}
.sync-err{color:#dc3545}
</style>
</head>

let prog={},trilhaAtual=null,aulaAberta=null,grupoAberto=null,stSel={},faseAtual=1;

async function init(){
  try{
    const r=await fetch(SCRIPT_URL+'?action=get');
    const d=await r.json();
    if(d.ok){prog=d.progresso||{};setSyncOk(true);}
  }catch(e){setSyncOk(false);}
  renderHome();
}

function setSyncOk(ok){
  const el=document.getElementById('syncBar');
  el.className='sync '+(ok?'sync-ok':'sync-err');
  el.textContent=ok?'Sincronizado':'Offline — verifique conexão';
}

function getSt(tid,n){return prog[tid]?.[n]?.status||'nao';}
function getMn(tid,n){return prog[tid]?.[n]?.minuto_atual||0;}
function getCm(tid,n){return prog[tid]?.[n]?.comentario||'';}

function calcP(tid){
  const t=TB[tid],tot=t.aulas.length;
  const ok=t.aulas.filter(a=>getSt(tid,a.num)==='concluida').length;
  return{ok,tot,pct:tot?Math.round(ok/tot*100):0};
}

function mkBadge(st,f2){
  if(f2)return '<span class="badge b-f2">Fase 2</span>';
  if(st==='concluida')return '<span class="badge b-con">Concluída</span>';
  if(st==='andamento')return '<span class="badge b-and">Em andamento</span>';
  return '<span class="badge b-nao">Não iniciada</span>';
}

function renderHome(){
  let html='',totA=0,ativ=0;
  Object.keys(TB).forEach(tid=>{
    const t=TB[tid],p=calcP(tid);
    totA+=p.ok;
    if(t.aulas.some(a=>getSt(tid,a.num)!=='nao')) ativ++;
    const f2=t.fase2_desbloqueada||false;
    const stG=f2?'f2':p.ok===p.tot?'concluida':p.ok>0?'andamento':'nao';
    html+=`<div class="tcard" onclick="abrirTrilha('${tid}')">
      <div class="tcard-top"><span class="tid">${tid}</span><span class="th">${t.horas_sem}h/sem</span></div>
      <div class="tnome">${t.nome}</div>
      <div class="tslots">${t.slots}</div>
      <div class="tmid">${mkBadge(stG,f2)}<span style="font-size:11px;color:#666">${p.ok}/${p.tot} aulas</span></div>
      <div class="pw"><div class="pb"><div class="pf" style="width:${p.pct}%"></div></div><div class="pt">${p.pct}%</div></div>
    </div>`;
  });
  document.getElementById('listaTrilhas').innerHTML=html;
  document.getElementById('totA').textContent=totA;
  document.getElementById('totT').textContent=ativ+'/7';
}

function abrirTrilha(tid){
  trilhaAtual=tid;aulaAberta=null;grupoAberto=null;faseAtual=1;
  const t=TB[tid],p=calcP(tid);
  document.getElementById('telaHome').style.display='none';
  document.getElementById('telaTrilha').style.display='flex';
  document.getElementById('btnV').style.display='block';
  document.getElementById('hT').textContent=t.nome;
  document.getElementById('hS').textContent=t.slots;
  document.getElementById('tN').textContent=`${tid} — ${t.nome}`;
  document.getElementById('tSl').textContent=t.slots;
  document.getElementById('tPF').style.width=p.pct+'%';
  document.getElementById('tPT').textContent=p.pct+'%';
  document.getElementById('tabF1').className='tab on';
  document.getElementById('tabF2').className='tab'+(t.fase2_desbloqueada?'':' bloq');
  renderFase1(tid);
}

function mudarFase(f){
  const t=TB[trilhaAtual];
  if(f===2&&!t.fase2_desbloqueada)return;
  faseAtual=f;
  document.getElementById('tabF1').className='tab'+(f===1?' on':'');
  document.getElementById('tabF2').className='tab'+(f===2?' on':(t.fase2_desbloqueada?'':' bloq'));
  f===1?renderFase1(trilhaAtual):renderFase2(trilhaAtual);
}

// ── Fase 1 com grupos comprimíveis ────────────────────────────────────────────
function renderFase1(tid){
  const t=TB[tid];
  const cf=document.getElementById('tcontent');

  // Agrupa aulas por módulo (T1) ou trata cada aula como item direto (T2-T7)
  const temModulos=t.modulos&&t.modulos.length>0;

  if(temModulos){
    // T1: grupos = módulos
    let html='';
    t.modulos.forEach((mod,mi)=>{
      const aulasGrupo=t.aulas.filter(a=>a.modulo_id===mod.id);
      const ok=aulasGrupo.filter(a=>getSt(tid,a.num)==='concluida').length;
      const pct=mod.n_aulas?Math.round(ok/mod.n_aulas*100):0;
      html+=renderGrupo(tid,mod.id,mod.nome,aulasGrupo,ok,mod.n_aulas,pct,mi);
    });
    cf.innerHTML=html;
  } else {
    // T2-T7: um único grupo expandido (sem header de grupo)
    let html='<div class="grupo" style="border-radius:12px">';
    html+='<div class="grupo-body" id="gb-all" style="display:block">';
    t.aulas.forEach(a=>{ html+=renderAulaHTML(tid,a); });
    html+='</div></div>';
    cf.innerHTML=html;
  }
}

function renderGrupo(tid,gid,gnome,aulas,ok,total,pct,idx){
  const aulasHTML=aulas.map(a=>renderAulaHTML(tid,a)).join('');
  return `<div class="grupo">
    <div class="grupo-hdr" onclick="togGrupo('${gid}')">
      <div class="grupo-ico">${idx+1}</div>
      <div class="grupo-info">
        <div class="grupo-nome">${gnome}</div>
        <div class="grupo-sub">${ok}/${total} aulas &middot; ${pct}%</div>
      </div>
      <div class="grupo-chev" id="gchev-${gid}">&#8250;</div>
    </div>
    <div class="grupo-body" id="gb-${gid}">${aulasHTML}</div>
  </div>`;
}

function renderAulaHTML(tid,a){
  const st=getSt(tid,a.num),mn=getMn(tid,a.num);
  const nc=st==='concluida'?'ok':st==='andamento'?'and':(a.tipo==='questoes'?'q':'');
  const tit=(a.titulo||[])[0]||`Aula ${a.num}`;
  const numDisp=a.num.includes('-')?a.num.split('-')[1]:a.num;
  const sub=mn>0?`min. ${mn}`:(a.duracao||'');
  const tbg=a.tipo==='questoes'?'tb-q':'tb-t';
  const tbl=a.tipo==='questoes'?'questões':'teoria';
  return `<div class="aula" id="aula-${a.num}">
    <div class="aula-hdr" onclick="togAula('${a.num}','${tid}')">
      <div class="anum ${nc}">${numDisp}</div>
      <div class="aula-info">
        <div class="atit">${tit}</div>
        <div class="asub"><span class="tbadge ${tbg}">${tbl}</span><span>${sub}</span></div>
      </div>
      <span class="achev" id="ach-${a.num}">&#8250;</span>
    </div>
    <div class="apanel" id="ap-${a.num}">
      <div class="campo"><div class="clbl">Duração</div><div class="cval">${a.duracao||'—'}</div></div>
      <div class="reg">
        <div class="reg-t">Registrar progresso</div>
        <div class="rg"><div class="rl">Status</div>
          <div class="ro">
            <button class="rb ${st==='andamento'?'on':''}" onclick="selSt('${tid}','${a.num}','andamento',this)">Em andamento</button>
            <button class="rb ${st==='concluida'?'on':''}" onclick="selSt('${tid}','${a.num}','concluida',this)">Concluída</button>
            <button class="rb ${st==='pulei'?'on':''}" onclick="selSt('${tid}','${a.num}','pulei',this)">Pulei</button>
          </div>
        </div>
        <div class="rg"><div class="rl">Minuto atual</div>
          <div class="mr"><input type="number" id="mn-${a.num}" value="${mn}" min="0" placeholder="0">
          <span style="font-size:11px;color:#666">de ${a.duracao||'?'}</span></div>
        </div>
        <div class="rg"><div class="rl">Comentários / dúvidas</div>
          <textarea class="ca" id="cm-${a.num}" placeholder="Dúvidas, palavras-chave, nº questão TEC...">${getCm(tid,a.num)}</textarea>
        </div>
        <button class="bsalvar" onclick="salvar('${tid}','${a.num}')">Salvar</button>
        <div class="msg" id="mg-${a.num}">Salvo!</div>
      </div>
    </div>
  </div>`;
}

function togGrupo(gid){
  const body=document.getElementById(`gb-${gid}`);
  const chev=document.getElementById(`gchev-${gid}`);
  if(!body)return;
  const aberto=body.style.display==='block';
  // Fecha grupo anterior
  if(grupoAberto&&grupoAberto!==gid){
    const ob=document.getElementById(`gb-${grupoAberto}`);
    const oc=document.getElementById(`gchev-${grupoAberto}`);
    if(ob)ob.style.display='none';
    if(oc)oc.classList.remove('ab');
    aulaAberta=null;
  }
  body.style.display=aberto?'none':'block';
  chev.classList.toggle('ab',!aberto);
  grupoAberto=aberto?null:gid;
  if(!aberto) body.parentElement.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function togAula(n,tid){
  const ap=document.getElementById(`ap-${n}`);
  const ac=document.getElementById(`ach-${n}`);
  if(!ap)return;
  const ab=ap.style.display==='block';
  if(aulaAberta&&aulaAberta!==n){
    const oap=document.getElementById(`ap-${aulaAberta}`);
    const oac=document.getElementById(`ach-${aulaAberta}`);
    if(oap)oap.style.display='none';
    if(oac)oac.classList.remove('ab');
  }
  ap.style.display=ab?'none':'block';
  ac.classList.toggle('ab',!ab);
  aulaAberta=ab?null:n;
  if(!ab) ap.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function selSt(tid,n,val,btn){
  btn.closest('.ro').querySelectorAll('.rb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(!stSel[tid])stSel[tid]={};
  stSel[tid][n]=val;
}

async function salvar(tid,n){
  const mn=parseInt(document.getElementById(`mn-${n}`)?.value)||0;
  const cm=document.getElementById(`cm-${n}`)?.value||'';
  const st=stSel[tid]?.[n]||getSt(tid,n)||'andamento';
  if(!prog[tid])prog[tid]={};
  prog[tid][n]={status:st,minuto_atual:mn,comentario:cm,topicos_cobertos:[]};
  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({
      action:'save',trilha_id:tid,aula_num:n,status:st,pag_atual:mn,topicos_cobertos:[],comentario:cm
    })});
  }catch(e){}
  const mg=document.getElementById(`mg-${n}`);
  if(mg){mg.style.display='block';setTimeout(()=>mg.style.display='none',1800);}
  // Atualiza progresso geral
  const p=calcP(tid);
  document.getElementById('tPF').style.width=p.pct+'%';
  document.getElementById('tPT').textContent=p.pct+'%';
  // Atualiza círculo da aula
  const an=document.querySelector(`#aula-${n} .anum`);
  if(an) an.className='anum'+(st==='concluida'?' ok':st==='andamento'?' and':'');
  // Atualiza contador do grupo
  if(trilhaAtual){
    const t=TB[trilhaAtual];
    if(t.modulos){
      const a=t.aulas.find(x=>x.num===n);
      if(a){
        const mod=t.modulos.find(m=>m.id===a.modulo_id);
        if(mod){
          const aulasG=t.aulas.filter(x=>x.modulo_id===mod.id);
          const ok=aulasG.filter(x=>getSt(trilhaAtual,x.num)==='concluida').length;
          const pct=Math.round(ok/mod.n_aulas*100);
          const gs=document.querySelector(`#gb-${mod.id}`)?.previousElementSibling?.querySelector('.grupo-sub');
          if(gs) gs.textContent=`${ok}/${mod.n_aulas} aulas · ${pct}%`;
        }
      }
    }
  }
}

// ── Fase 2 ────────────────────────────────────────────────────────────────────
function renderFase2(tid){
  const t=TB[tid];
  const cf=document.getElementById('tcontent');
  if(!t.fase2_desbloqueada){
    cf.innerHTML=`<div class="f2panel"><div class="f2lock">
      <div class="f2icon">&#128274;</div>
      <div class="f2txt">Fase de exercícios bloqueada.<br>Avance quando se sentir pronto.</div>
      <button class="bunlock" onclick="desbloquear('${tid}')">Avançar para Fase 2 — Exercícios</button>
    </div></div>`;
    return;
  }
  const mods=t.modulos||[{id:'M0',nome:t.nome,n_aulas:t.aulas.length}];
  let html='<div class="f2panel">';
  html+=`<p style="font-size:12px;color:#666;margin-bottom:12px;line-height:1.6">Acesse o <strong>TEC Concursos</strong>, filtre por <strong>FCC + tópico</strong> e registre seu desempenho.</p>`;
  mods.forEach(mod=>{
    html+=`<div class="teccard">
      <div class="tectit">${mod.nome}</div>
      <div class="clbl" style="margin-bottom:3px">Busca no TEC</div>
      <div class="tecbusca">FCC &nbsp;|&nbsp; ${mod.nome}</div>
      <div class="rl">Desempenho</div>
      <div class="trow">
        <div><input class="tinput" type="number" id="qt-${tid}-${mod.id}" placeholder="0" min="0" oninput="calcPerc('${tid}','${mod.id}')"><div class="tlbl">Feitas</div></div>
        <div><input class="tinput" type="number" id="qa-${tid}-${mod.id}" placeholder="0" min="0" oninput="calcPerc('${tid}','${mod.id}')"><div class="tlbl">Acertos</div></div>
        <div><input class="tinput" type="number" id="qp-${tid}-${mod.id}" placeholder="0" readonly style="background:#f5f5f5"><div class="tlbl">%</div></div>
      </div>
    </div>`;
  });
  html+=`<button class="bsalvar" onclick="salvarF2()">Salvar</button>`;
  html+=`<div class="msg" id="mg-f2">Salvo!</div>`;
  html+='</div>';
  cf.innerHTML=html;
}

function calcPerc(tid,mid){
  const qt=parseInt(document.getElementById(`qt-${tid}-${mid}`)?.value)||0;
  const qa=parseInt(document.getElementById(`qa-${tid}-${mid}`)?.value)||0;
  const qp=document.getElementById(`qp-${tid}-${mid}`);
  if(qp) qp.value=qt>0?Math.round(qa/qt*100):0;
}

function desbloquear(tid){
  if(!confirm('Confirma avançar para a Fase 2?'))return;
  TB[tid].fase2_desbloqueada=true;
  document.getElementById('tabF2').className='tab';
  mudarFase(2);
}

async function salvarF2(){
  const mg=document.getElementById('mg-f2');
  if(mg){mg.style.display='block';setTimeout(()=>mg.style.display='none',1800);}
}

function voltarHome(){
  document.getElementById('telaHome').style.display='block';
  document.getElementById('telaTrilha').style.display='none';
  document.getElementById('btnV').style.display='none';
  document.getElementById('hT').textContent='Trilhas ICMS-BA 2026';
  document.getElementById('hS').textContent='Fase de estudo · 7 trilhas';
  trilhaAtual=null;renderHome();
}

init();
</script>
