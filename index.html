let prog={}, trilhaAtual=null, aulaAberta=null, stSel={};

async function init(){
  try{
    const r=await fetch(SCRIPT_URL+'?action=get');
    const d=await r.json();
    if(d.ok){prog=d.progresso||{};setSync(true);}
  }catch(e){setSync(false);}
  renderHome();
}

function setSync(ok){
  const el=document.getElementById('syncBar');
  el.className='sync-bar '+(ok?'sync-ok':'sync-err');
  el.textContent=ok?'Sincronizado com Google Sheets':'Offline — verifique conexão';
}

function getSt(tid,n){return prog[tid]?.[n]?.status||'nao';}
function getPg(tid,n){return prog[tid]?.[n]?.pag_atual||0;}
function getTops(tid,n){return prog[tid]?.[n]?.topicos_cobertos||[];}

function calcP(tid){
  const t=TB[tid], total=t.aulas.length;
  const ok=t.aulas.filter(a=>getSt(tid,a.num)==='concluida').length;
  return{ok,total,pct:total?Math.round(ok/total*100):0};
}

function badge(st){
  if(st==='concluida') return '<span class="badge badge-con">Concluída</span>';
  if(st==='andamento') return '<span class="badge badge-and">Em andamento</span>';
  return '<span class="badge badge-nao">Não iniciada</span>';
}

function renderHome(){
  let html='', totA=0, ativ=0;
  Object.keys(TB).forEach(tid=>{
    const t=TB[tid], p=calcP(tid);
    totA+=p.ok;
    const temAtiv=t.aulas.some(a=>getSt(tid,a.num)!=='nao');
    if(temAtiv) ativ++;
    const prox=t.aulas.find(a=>getSt(tid,a.num)!=='concluida');
    const stG=p.ok===p.total?'concluida':p.ok>0?'andamento':'nao';
    html+=`<div class="trilha-card" onclick="abrirTrilha('${tid}')">
      <div class="trilha-top"><span class="trilha-id">${tid}</span><span class="trilha-horas">${t.horas_sem}h/sem</span></div>
      <div class="trilha-nome">${t.nome}</div>
      <div class="trilha-slots">${t.slots}</div>
      <div class="trilha-mid">${badge(stG)}<span style="font-size:11px;color:#666">${p.ok}/${p.total} aulas</span></div>
      <div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:${p.pct}%"></div></div><div class="prog-txt">${p.pct}%</div></div>
    </div>`;
  });
  document.getElementById('listaTrilhas').innerHTML=html;
  document.getElementById('totAulas').textContent=totA;
  document.getElementById('totTrilhas').textContent=ativ+'/7';
}

function abrirTrilha(tid){
  trilhaAtual=tid; aulaAberta=null;
  const t=TB[tid], p=calcP(tid);
  document.getElementById('telaHome').style.display='none';
  document.getElementById('telaTrilha').style.display='flex';
  document.getElementById('btnVoltar').style.display='block';
  document.getElementById('hTitulo').textContent=t.nome;
  document.getElementById('hSub').textContent=t.slots;
  document.getElementById('tNome').textContent=`${tid} — ${t.nome}`;
  document.getElementById('tSlots').textContent=t.slots;
  document.getElementById('tProgFill').style.width=p.pct+'%';
  document.getElementById('tProgTxt').textContent=p.pct+'%';
  renderAulas(tid);
}

function renderAulas(tid){
  const t=TB[tid];
  let html='';
  t.aulas.forEach(a=>{
    const st=getSt(tid,a.num), pg=getPg(tid,a.num), tops=getTops(tid,a.num);
    const nc=st==='concluida'?'ok':st==='andamento'?'and':'';
    const sub=pg>0?`Parou na p. ${pg}`:a.pag_apostila||'';
    const tit=(a.titulo||[])[0]||`Aula ${a.num}`;

    const topHtml=(a.topicos||[]).map((top,i)=>{
      const on=tops.includes(String(i))?'on':'';
      return `<div class="top-item"><div class="chk ${on}" onclick="toggleTop('${tid}',${a.num},${i},this)">&#10003;</div><span class="top-txt">${top}</span></div>`;
    }).join('');

    const refH=a.cap_livro?`<div class="campo"><div class="clabel">Ref. livro</div><div class="cval ref">Cap. ${a.cap_livro} &middot; ${a.pag_livro}</div></div>`:'';
    const pkH=a.palavras_chave?`<div class="campo"><div class="clabel">Palavras-chave FCC</div><div class="cval">${a.palavras_chave}</div></div>`:'';
    const fonteLabel=t.fonte==='videoaula'?'Videoaula':'Apostila';

    html+=`<div class="aula-item" id="ai-${a.num}">
      <div class="aula-hdr" onclick="togAula(${a.num})">
        <div class="aula-num ${nc}">${a.num}</div>
        <div class="aula-info"><div class="aula-titulo">${tit}</div><div class="aula-sub">${sub}</div></div>
        <div class="chev" id="cv-${a.num}">&#8250;</div>
      </div>
      <div class="panel" id="pn-${a.num}">
        <div class="campo"><div class="clabel">Fonte</div><div class="cval">${fonteLabel}</div></div>
        <div class="campo"><div class="clabel">Material</div><div class="cval">${a.pag_apostila||'—'}</div></div>
        ${refH}${pkH}
        ${topHtml?`<div class="campo"><div class="clabel">Tópicos do edital</div><div class="top-lista">${topHtml}</div></div>`:''}
        <div class="registro">
          <div class="reg-titulo">Registrar progresso</div>
          <div class="reg-grp"><div class="reg-lbl">Status</div>
            <div class="reg-opts">
              <button class="rbtn ${st==='andamento'?'on':''}" onclick="selSt('${tid}',${a.num},'andamento',this)">Em andamento</button>
              <button class="rbtn ${st==='concluida'?'on':''}" onclick="selSt('${tid}',${a.num},'concluida',this)">Concluída</button>
              <button class="rbtn ${st==='pulei'?'on':''}" onclick="selSt('${tid}',${a.num},'pulei',this)">Pulei</button>
            </div>
          </div>
          <div class="reg-grp"><div class="reg-lbl">Página atual</div>
            <div class="pag-row"><input type="number" id="pg-${a.num}" value="${pg}" min="0"></div>
          </div>
          <button class="btn-salvar" onclick="salvar('${tid}',${a.num})">Salvar</button>
          <div class="msg-ok" id="mg-${a.num}">Salvo!</div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('listaAulas').innerHTML=html;
}

function togAula(n){
  const pn=document.getElementById(`pn-${n}`), cv=document.getElementById(`cv-${n}`);
  const ab=pn.style.display==='block';
  if(aulaAberta!==null&&aulaAberta!==n){
    document.getElementById(`pn-${aulaAberta}`).style.display='none';
    document.getElementById(`cv-${aulaAberta}`).classList.remove('ab');
  }
  pn.style.display=ab?'none':'block';
  cv.classList.toggle('ab',!ab);
  aulaAberta=ab?null:n;
  if(!ab) pn.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function toggleTop(tid,n,i,el){
  if(!prog[tid])prog[tid]={};
  if(!prog[tid][n])prog[tid][n]={status:'nao',pag_atual:0,topicos_cobertos:[]};
  const tops=prog[tid][n].topicos_cobertos, si=String(i), pos=tops.indexOf(si);
  pos>=0?tops.splice(pos,1):tops.push(si);
  el.classList.toggle('on');
}

function selSt(tid,n,val,btn){
  btn.closest('.reg-opts').querySelectorAll('.rbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(!stSel[tid])stSel[tid]={};
  stSel[tid][n]=val;
}

async function salvar(tid,n){
  const pg=parseInt(document.getElementById(`pg-${n}`).value)||0;
  const st=stSel[tid]?.[n]||getSt(tid,n)||'andamento';
  const tops=getTops(tid,n);
  if(!prog[tid])prog[tid]={};
  prog[tid][n]={status:st,pag_atual:pg,topicos_cobertos:tops};
  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'save',trilha_id:tid,aula_num:n,status:st,pag_atual:pg,topicos_cobertos:tops})});
    const mg=document.getElementById(`mg-${n}`);
    mg.style.display='block'; setTimeout(()=>mg.style.display='none',2000);
  }catch(e){alert('Erro ao salvar.');}
  const p=calcP(tid);
  document.getElementById('tProgFill').style.width=p.pct+'%';
  document.getElementById('tProgTxt').textContent=p.pct+'%';
  const nm=document.querySelector(`#ai-${n} .aula-num`);
  if(nm)nm.className='aula-num'+(st==='concluida'?' ok':st==='andamento'?' and':'');
}

function voltarHome(){
  document.getElementById('telaHome').style.display='block';
  document.getElementById('telaTrilha').style.display='none';
  document.getElementById('btnVoltar').style.display='none';
  document.getElementById('hTitulo').textContent='Trilhas ICMS-BA 2026';
  document.getElementById('hSub').textContent='Fase de estudo · 7 trilhas';
  trilhaAtual=null; renderHome();
}

init();
</script>
