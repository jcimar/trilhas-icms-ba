<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#1a1a1a;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hdr-back{font-size:24px;cursor:pointer;display:none;line-height:1;padding-right:4px}
.hdr h1{font-size:16px;font-weight:600;flex:1}
.hdr-sub{font-size:11px;opacity:0.7;margin-top:2px}
.home{padding:14px;flex:1}
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rcard{background:#f5f5f5;border-radius:10px;padding:12px}
.rnum{font-size:22px;font-weight:700}
.rlbl{font-size:11px;color:#666;margin-top:2px}
.tcard{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.tcard:active{background:#f9f9f9}
.tcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tid{font-size:11px;font-weight:700;background:#1a1a1a;color:#fff;padding:3px 10px;border-radius:20px}
.th{font-size:11px;color:#666}
.tnome{font-size:15px;font-weight:600;margin-bottom:2px}
.tslots{font-size:11px;color:#666;margin-bottom:8px}
.tmid{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px}
.b-nao{background:#f0f0f0;color:#666}
.b-and{background:#fff3cd;color:#856404}
.b-con{background:#d4edda;color:#155724}
.b-f2{background:#e8f0fb;color:#0c447c}
.pw{display:flex;align-items:center;gap:8px}
.pb{flex:1;height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.pf{height:100%;background:#1a1a1a;border-radius:3px;transition:width 0.3s}
.pt{font-size:11px;color:#666;white-space:nowrap}
.tscreen{display:none;flex-direction:column;flex:1;overflow:hidden}
.thdr{padding:14px 16px;background:#1a1a1a;color:#fff;flex-shrink:0}
.thdr-nome{font-size:16px;font-weight:700;margin-bottom:2px}
.thdr-slots{font-size:11px;opacity:0.8;margin-bottom:10px}
.pg{display:flex;align-items:center;gap:10px}
.pg .pb{height:8px}
.pg .pt{font-size:13px;font-weight:600;min-width:36px;text-align:right;color:#fff;opacity:1}
.tabs{display:flex;border-bottom:1px solid #e0e0e0;background:#fff;flex-shrink:0}
.tab{flex:1;padding:11px;text-align:center;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#1a1a1a;border-bottom-color:#1a1a1a}
.tab.bloq{color:#ccc;cursor:default}
.tcontent{overflow-y:auto;flex:1;padding:12px}
/* Grupos (módulos) */
.grupo{border:1px solid #e0e0e0;border-radius:12px;margin-bottom:8px;overflow:hidden}
.grupo-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#f8f8f8}
.grupo-hdr:active{background:#f0f0f0}
.grupo-ico{width:28px;height:28px;border-radius:8px;background:#1a1a1a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.grupo-info{flex:1;min-width:0}
.grupo-nome{font-size:13px;font-weight:600;line-height:1.3}
.grupo-sub{font-size:11px;color:#666;margin-top:2px}
.grupo-chev{font-size:16px;color:#999;transition:transform 0.2s;flex-shrink:0}
.grupo-chev.ab{transform:rotate(90deg)}
.grupo-body{display:none;border-top:1px solid #f0f0f0}
/* Aula (modo módulos) */
.aula{border-bottom:1px solid #f0f0f0;cursor:pointer}
.aula:last-child{border-bottom:none}
.aula-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;background:#fff}
.aula-hdr:active{background:#f9f9f9}
.anum{width:28px;height:28px;border-radius:50%;background:#e8e8e8;color:#666;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.anum.ok{background:#28a745;color:#fff}
.anum.and{background:#ffc107;color:#1a1a1a}
.anum.q{background:#e8f0fb;color:#0c447c}
.aula-info{flex:1;min-width:0}
.atit{font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asub{font-size:10px;color:#888;margin-top:2px;display:flex;gap:5px;align-items:center}
.tbadge{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600;flex-shrink:0}
.tb-t{background:#e8f5e9;color:#27500a}
.tb-q{background:#e8f0fb;color:#0c447c}
.achev{font-size:14px;color:#ddd;flex-shrink:0;transition:transform 0.2s}
.achev.ab{transform:rotate(90deg)}
.apanel{display:none;background:#fafafa;border-top:1px solid #f0f0f0;padding:12px 14px}
/* Tópico do edital (modo tópicos) */
.topico-item{border:1px solid #e0e0e0;border-radius:10px;margin-bottom:8px;overflow:hidden}
.topico-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff}
.topico-hdr:active{background:#f9f9f9}
.topico-status{width:10px;height:10px;border-radius:50%;background:#e0e0e0;flex-shrink:0}
.topico-status.ok{background:#28a745}
.topico-status.and{background:#ffc107}
.topico-info{flex:1;min-width:0}
.topico-txt{font-size:13px;font-weight:600;line-height:1.4}
.topico-sub{font-size:10px;color:#888;margin-top:2px}
.topico-chev{font-size:14px;color:#ddd;flex-shrink:0;transition:transform 0.2s}
.topico-chev.ab{transform:rotate(90deg)}
.topico-body{display:none;background:#fafafa;border-top:1px solid #f0f0f0;padding:12px 14px}
/* Material por tópico */
.mat-item{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.mat-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mat-ico{font-size:14px;flex-shrink:0}
.mat-nome{font-size:12px;font-weight:700;flex:1}
.mat-ref{font-size:11px;color:#666;font-style:italic}
.mat-status{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.msb{font-size:11px;padding:5px 10px;border:1.5px solid #ddd;border-radius:14px;cursor:pointer;background:#fff;color:#1a1a1a;font-weight:500}
.msb.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.mat-pag{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.mat-pag input{width:65px;padding:6px;border:1.5px solid #ddd;border-radius:7px;font-size:13px;text-align:center}
.mat-pag input:focus{outline:none;border-color:#1a1a1a}
.mat-pag label{font-size:10px;color:#888}
.mat-coment{width:100%;padding:7px;border:1.5px solid #ddd;border-radius:7px;font-size:12px;font-family:inherit;resize:vertical;min-height:44px}
.mat-coment:focus{outline:none;border-color:#1a1a1a}
.mat-salvar{width:100%;padding:9px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px}
.mat-salvar:active{background:#333}
.mat-msg{text-align:center;color:#28a745;font-size:11px;font-weight:600;padding:4px;display:none}
/* Registro (modo módulos) */
.reg{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-top:8px}
.reg-t{font-size:12px;font-weight:700;margin-bottom:10px}
.rg{margin-bottom:10px}
.rl{font-size:10px;color:#666;margin-bottom:5px}
.ro{display:flex;gap:5px;flex-wrap:wrap}
.rb{font-size:11px;padding:6px 12px;border:1.5px solid #ddd;border-radius:16px;cursor:pointer;background:#fff;color:#1a1a1a;font-weight:500}
.rb.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.mr{display:flex;align-items:center;gap:8px}
.mr input{width:70px;padding:8px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;text-align:center}
.mr input:focus{outline:none;border-color:#1a1a1a}
.ca{width:100%;padding:8px;border:1.5px solid #ddd;border-radius:8px;font-size:12px;font-family:inherit;resize:vertical;min-height:56px}
.ca:focus{outline:none;border-color:#1a1a1a}
.bsalvar{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.bsalvar:active{background:#333}
.msg{text-align:center;color:#28a745;font-size:12px;font-weight:600;padding:6px;display:none}
/* Fase 2 */

.f2lock{text-align:center;padding:32px 16px}
.f2icon{font-size:44px;margin-bottom:14px}
.f2txt{font-size:13px;color:#666;line-height:1.6;margin-bottom:18px}
.bunlock{width:100%;padding:13px;background:#fff;color:#1a1a1a;border:2px solid #1a1a1a;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.teccard{background:#e8f0fb;border-radius:10px;padding:12px;margin-bottom:8px}
.tectit{font-size:12px;font-weight:700;color:#0c447c;margin-bottom:6px}
.tecbusca{font-size:11px;color:#1a4a8a;background:#fff;border-radius:6px;padding:7px 9px;margin-bottom:8px;font-family:monospace}
.trow{display:flex;gap:8px;margin-top:6px}
.tinput{flex:1;padding:7px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;text-align:center}
.tlbl{font-size:10px;color:#666;text-align:center;margin-top:3px}
.sync{font-size:11px;text-align:center;padding:8px;color:#888}
.sync-ok{color:#28a745}
.sync-err{color:#dc3545}
.clbl{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px}
.campo{margin-bottom:10px}
.cval{font-size:12px;color:#1a1a1a;line-height:1.5}

/* Separador de bloco */
.bloco-sep{background:#1a1a1a;color:#fff;padding:8px 14px;font-size:11px;font-weight:700;
letter-spacing:0.08em;text-transform:uppercase;margin:10px 0 6px;border-radius:8px}


/* Cronômetro */
.crono-wrap{background:#f8f8f8;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin:10px 0}
.crono-display{font-size:28px;font-weight:700;font-family:monospace;text-align:center;
  letter-spacing:2px;color:#1a1a1a;margin-bottom:10px}
.crono-btns{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.cbtn{padding:8px 14px;border:1.5px solid #1a1a1a;border-radius:8px;font-size:12px;
  font-weight:700;cursor:pointer;background:#fff;color:#1a1a1a}
.cbtn:active{background:#f0f0f0}
.cbtn.start{background:#1a1a1a;color:#fff}
.cbtn.pause{background:#856404;color:#fff;border-color:#856404}
.cbtn.stop{background:#72243E;color:#fff;border-color:#72243E}
.cbtn.reset{background:#fff;color:#888;border-color:#ccc}
.crono-tempos{display:flex;justify-content:space-around;font-size:11px;color:#666}
.crono-tempos span{text-align:center}
.crono-tempos strong{display:block;font-size:13px;color:#1a1a1a;font-weight:700}
/* Meta semanal */
.meta-wrap{background:#f0f0f0;border-radius:8px;padding:10px 14px;margin:0 12px 10px}
.meta-row{display:flex;align-items:center;gap:8px}
.meta-label{font-size:11px;color:#666;flex-shrink:0}
.meta-pb{flex:1;height:8px;background:#d0d0d0;border-radius:4px;overflow:hidden}
.meta-pf{height:100%;background:#1a1a1a;border-radius:4px;transition:width 0.4s}
.meta-txt{font-size:11px;font-weight:700;color:#1a1a1a;white-space:nowrap}
.meta-sub{font-size:10px;color:#888;margin-top:3px}
/* Campo página híbrido */
.pag-hybrid{display:flex;align-items:center;gap:6px}
.pag-hybrid select{flex:1;padding:7px;border:1.5px solid #ddd;border-radius:8px;
  font-size:13px;background:#fff}
.pag-hybrid select:focus{outline:none;border-color:#1a1a1a}
.pag-hybrid input{width:65px;padding:7px;border:1.5px solid #ddd;border-radius:8px;
  font-size:13px;text-align:center}
.pag-hybrid input:focus{outline:none;border-color:#1a1a1a}
.pag-ou{font-size:10px;color:#888}
/* Auto-save indicator */
.autosave-ind{font-size:10px;color:#28a745;text-align:center;padding:2px;display:none}

</style>
</head>

// ── Sync ──────────────────────────────────────────────────────────────────────
async function init(){
  try{
    const r=await fetch(SCRIPT_URL+'?action=get');
    const d=await r.json();
    if(d.ok){prog=d.progresso||{};setSyncOk(true);}
  }catch(e){setSyncOk(false);}
  renderHome();
}
function setSyncOk(ok){
  const el=document.getElementById('syncBar');
  if(!el)return;
  el.className='sync '+(ok?'sync-ok':'sync-err');
  el.textContent=ok?'Sincronizado':'Offline — verifique conexão';
}

// ── Helpers prog ──────────────────────────────────────────────────────────────
function getP(tid,key){return prog[tid]?.[key]||{};}
function getSt(tid,key){return getP(tid,key).status||'nao';}
function getPag(tid,key){return getP(tid,key).pagina_atual||0;}
function getCm(tid,key){return getP(tid,key).comentario||'';}
function getAcum(tid,key){return getP(tid,key).tempo_acumulado||0;}

function calcProgresso(tid){
  const t=TB[tid];
  const modo=t.modo||'aulas';
  let tot=0,ok=0;
  if(modo==='modulos'){
    tot=t.aulas.length;
    ok=t.aulas.filter(a=>getSt(tid,a.num)==='concluida').length;
  } else if(modo==='topicos'){
    (t.topicos||[]).forEach(top=>{
      (top.materiais||[]).forEach(m=>{
        tot++;
        if(getSt(tid,`${top.id}_${m.id}`)==='concluido') ok++;
      });
    });
  } else {
    tot=(t.aulas||[]).length;
    ok=(t.aulas||[]).filter(a=>getSt(tid,a.num)==='concluida').length;
  }
  return{ok,tot,pct:tot?Math.round(ok/tot*100):0};
}

function mkBadge(st,f2){
  if(f2)return '<span class="badge b-f2">Fase 2</span>';
  if(st==='concluida'||st==='concluido')return '<span class="badge b-con">Concluída</span>';
  if(st==='andamento')return '<span class="badge b-and">Em andamento</span>';
  return '<span class="badge b-nao">Não iniciada</span>';
}

// ── Cronômetro ────────────────────────────────────────────────────────────────
function getCrono(key){
  if(!cronoState[key]) cronoState[key]={running:false,startTs:0,sessao:0,acumulado:0,interval:null};
  return cronoState[key];
}

function fmtTempo(seg){
  const h=Math.floor(seg/3600),m=Math.floor((seg%3600)/60),s=seg%60;
  return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
            :`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtTempoLeg(seg){
  if(seg<60) return `${seg}s`;
  const h=Math.floor(seg/3600),m=Math.floor((seg%3600)/60);
  return h>0?`${h}h${String(m).padStart(2,'0')}min`:`${m}min`;
}

function atualizaDisplay(key){
  const c=getCrono(key);
  const agora=c.running?Math.floor((Date.now()-c.startTs)/1000):0;
  const sessao=c.sessao+agora;
  const el=document.getElementById(`crono-${key}`);
  const es=document.getElementById(`csessao-${key}`);
  const ea=document.getElementById(`cacum-${key}`);
  if(el) el.textContent=fmtTempo(sessao);
  if(es) es.textContent=fmtTempoLeg(sessao);
  if(ea) ea.textContent=fmtTempoLeg(c.acumulado+sessao);
}

function cronoStart(key){
  const c=getCrono(key);
  if(c.running) return;
  c.running=true;
  c.startTs=Date.now()-c.sessao*1000;
  c.startTs=Date.now();
  c.interval=setInterval(()=>atualizaDisplay(key),1000);
  atualizaDisplay(key);
  document.getElementById(`cbtn-start-${key}`)?.classList.add('start');
  document.getElementById(`cbtn-pause-${key}`)?.classList.remove('pause');
}

function cronoPause(key){
  const c=getCrono(key);
  if(!c.running) return;
  c.sessao+=Math.floor((Date.now()-c.startTs)/1000);
  c.running=false;
  clearInterval(c.interval);
  atualizaDisplay(key);
}

function cronoStop(key,tid,topId,matId){
  const c=getCrono(key);
  if(c.running){
    c.sessao+=Math.floor((Date.now()-c.startTs)/1000);
    c.running=false;
    clearInterval(c.interval);
  }
  c.acumulado+=c.sessao;
  c.sessao=0;
  atualizaDisplay(key);
  // Auto-save ao stop
  salvarMat(tid,topId,matId,true);
}

function cronoReset(key){
  const c=getCrono(key);
  if(c.running){clearInterval(c.interval);c.running=false;}
  c.sessao=0;
  atualizaDisplay(key);
}

// ── Auto-save a cada 5 min ────────────────────────────────────────────────────
function iniciarAutoSave(){
  if(autoSaveInterval) clearInterval(autoSaveInterval);
  autoSaveInterval=setInterval(()=>{
    if(!trilhaAtual) return;
    const t=TB[trilhaAtual];
    if(!t||t.modo!=='topicos') return;
    // Salva todos os tópicos com cronômetro rodando
    (t.topicos||[]).forEach(top=>{
      (top.materiais||[]).forEach(m=>{
        const key=`${top.id}_${m.id}`;
        const c=cronoState[key];
        if(c&&(c.running||c.sessao>0||c.acumulado>0)){
          salvarMat(trilhaAtual,top.id,m.id,false,true); // silent
        }
      });
    });
  },5*60*1000); // 5 minutos
}

// ── Home ──────────────────────────────────────────────────────────────────────
function renderHome(){
  let html='',totA=0,ativ=0;
  Object.keys(TB).forEach(tid=>{
    const t=TB[tid],p=calcProgresso(tid);
    totA+=p.ok;
    if(p.ok>0||(t.aulas&&t.aulas.some(a=>getSt(tid,a.num)!=='nao'))) ativ++;
    const f2=t.fase2_desbloqueada||false;
    const stG=f2?'f2':p.ok===p.tot&&p.tot>0?'concluida':p.ok>0?'andamento':'nao';
    const hSem=t.horas_sem>0?`${t.horas_sem}h/sem`:'A definir';
    html+=`<div class="tcard" onclick="abrirTrilha('${tid}')">
      <div class="tcard-top"><span class="tid">${tid}</span><span class="th">${hSem}</span></div>
      <div class="tnome">${t.nome}</div>
      <div class="tslots">${t.slots}</div>
      <div class="tmid">${mkBadge(stG,f2)}<span style="font-size:11px;color:#666">${p.ok}/${p.tot} itens</span></div>
      <div class="pw"><div class="pb"><div class="pf" style="width:${p.pct}%"></div></div><div class="pt">${p.pct}%</div></div>
    </div>`;
  });
  document.getElementById('listaTrilhas').innerHTML=html;
  document.getElementById('totA').textContent=totA;
  document.getElementById('totT').textContent=ativ+'/'+Object.keys(TB).length;
}

function abrirTrilha(tid){
  trilhaAtual=tid;aberto={grupo:null,item:null};faseAtual=1;
  const t=TB[tid],p=calcProgresso(tid);
  document.getElementById('telaHome').style.display='none';
  document.getElementById('telaTrilha').style.display='flex';
  document.getElementById('btnV').style.display='block';
  document.getElementById('hT').textContent=t.nome;
  document.getElementById('hS').textContent=t.slots;
  document.getElementById('tN').textContent=`${tid} — ${t.nome}`;
  document.getElementById('tSl').textContent=t.slots;
  document.getElementById('tPF').style.width=p.pct+'%';
  document.getElementById('tPT').textContent=p.pct+'%';
  document.getElementById('tabF1').className='tab on';
  document.getElementById('tabF2').className='tab'+(t.fase2_desbloqueada?'':' bloq');
  renderMetaSemanal(tid);
  renderFase1(tid);
  iniciarAutoSave();
}

function mudarFase(f){
  const t=TB[trilhaAtual];
  if(f===2&&!t.fase2_desbloqueada)return;
  faseAtual=f;
  document.getElementById('tabF1').className='tab'+(f===1?' on':'');
  document.getElementById('tabF2').className='tab'+(f===2?' on':(t.fase2_desbloqueada?'':' bloq'));
  f===1?renderFase1(trilhaAtual):renderFase2(trilhaAtual);
}

// ── Meta semanal ──────────────────────────────────────────────────────────────
function renderMetaSemanal(tid){
  const t=TB[tid];
  const metaSeg=t.horas_sem*3600;
  if(metaSeg<=0){
    document.getElementById('metaWrap')&&(document.getElementById('metaWrap').style.display='none');
    return;
  }
  // Soma tempo acumulado desta semana (todos os materiais)
  let totalSeg=0;
  if(t.modo==='topicos'){
    (t.topicos||[]).forEach(top=>{
      (top.materiais||[]).forEach(m=>{
        const key=`${top.id}_${m.id}`;
        totalSeg+=getCrono(key).acumulado+getAcum(tid,key);
      });
    });
  }
  const pct=Math.min(Math.round(totalSeg/metaSeg*100),100);
  const mw=document.getElementById('metaWrap');
  if(mw){
    mw.style.display='block';
    mw.innerHTML=`<div class="meta-row">
      <span class="meta-label">Meta ${t.horas_sem}h/sem</span>
      <div class="meta-pb"><div class="meta-pf" style="width:${pct}%"></div></div>
      <span class="meta-txt">${pct}%</span>
    </div>
    <div class="meta-sub">${fmtTempoLeg(totalSeg)} estudados esta semana</div>`;
  }
}

        <div class="topico-hdr" onclick="togTopico('${top.id}','${tid}')">
          <div class="topico-status ${stTop}"></div>
          <div class="topico-info">
            <div class="topico-txt">${top.topico}</div>
            <div class="topico-sub">${nOk}/${nMats} materiais</div>
          </div>
          <span class="topico-chev" id="tch-${top.id}">&#8250;</span>
        </div>
        <div class="topico-body" id="tb-${top.id}">
          ${(top.materiais||[]).map(m=>renderMaterial(tid,top.id,m)).join('')}
        </div>
      </div>`;
    });
    cf.innerHTML=html;

  } else if(modo==='modulos'){
    let html='';
    (t.modulos||[]).forEach((mod,mi)=>{
      const aulasG=(t.aulas||[]).filter(a=>a.modulo_id===mod.id);
      const ok=aulasG.filter(a=>getSt(tid,a.num)==='concluida').length;
      const pct=mod.n_aulas?Math.round(ok/mod.n_aulas*100):0;
      const aulasHTML=aulasG.map(a=>renderAulaHTML(tid,a)).join('');
      html+=`<div class="grupo">
        <div class="grupo-hdr" onclick="togGrupo('${mod.id}')">
          <div class="grupo-ico">${mi+1}</div>
          <div class="grupo-info">
            <div class="grupo-nome">${mod.nome}</div>
            <div class="grupo-sub" id="gsub-${mod.id}">${ok}/${mod.n_aulas} aulas · ${pct}%</div>
          </div>
          <div class="grupo-chev" id="gchev-${mod.id}">&#8250;</div>
        </div>
        <div class="grupo-body" id="gb-${mod.id}">${aulasHTML}</div>
      </div>`;
    });
    cf.innerHTML=html;
  } else {
    let html='<div class="grupo" style="border-radius:12px"><div class="grupo-body" style="display:block">';
    (t.aulas||[]).forEach(a=>{ html+=renderAulaHTML(tid,a); });
    html+='</div></div>';
    cf.innerHTML=html;
  }
}

// ── Renderiza material com cronômetro e página híbrida ────────────────────────
function renderMaterial(tid,topId,m){
  const key=`${top_key(topId,m.id)}`;
  const st=getSt(tid,key);
  const pg=getPag(tid,key);
  const cm=getCm(tid,key);
  const acum=getAcum(tid,key)+(getCrono(key).acumulado||0);
  const ico=m.tipo==='livro'?'📖':m.tipo==='videoaula'?'🎬':'📄';

  // Campo página híbrido — detecta intervalo na referência
  let pagField='';
  const refMatch=m.referencia&&m.referencia.match(/p\.(\d+)[–-](\d+)/);
  if(m.tipo==='videoaula'){
    pagField=`<div class="mat-pag"><label>Min. atual</label>
      <input type="number" id="pg-${key}" value="${pg}" min="0" placeholder="0"></div>`;
  } else if(refMatch){
    const pIni=parseInt(refMatch[1]),pFim=parseInt(refMatch[2]);
    let opts='<option value="">—</option>';
    for(let p=pIni;p<=pFim;p++) opts+=`<option value="${p}"${pg==p?' selected':''}>${p}</option>`;
    pagField=`<div class="mat-pag"><label>Pág. atual</label>
      <div class="pag-hybrid">
        <select id="pgsel-${key}" onchange="syncPagInput('${key}')">
          ${opts}
        </select>
        <span class="pag-ou">ou</span>
        <input type="number" id="pg-${key}" value="${pg||''}" min="0" placeholder="nº"
          oninput="syncPagSelect('${key}')">
      </div></div>`;
  } else {
    pagField=`<div class="mat-pag"><label>Pág. atual</label>
      <input type="number" id="pg-${key}" value="${pg||''}" min="0" placeholder="0"></div>`;
  }

  return `<div class="mat-item" id="mat-${key}">
    <div class="mat-top">
      <span class="mat-ico">${ico}</span>
      <span class="mat-nome">${m.nome}</span>
    </div>
    <div class="mat-ref">${m.referencia||''}</div>

    <div class="crono-wrap">
      <div class="crono-display" id="crono-${key}">00:00</div>
      <div class="crono-btns">
        <button class="cbtn start" id="cbtn-start-${key}"
          onclick="cronoStart('${key}')">▶ Start</button>
        <button class="cbtn pause" id="cbtn-pause-${key}"
          onclick="cronoPause('${key}')">⏸ Pause</button>
        <button class="cbtn stop"
          onclick="cronoStop('${key}','${tid}','${topId}','${m.id}')">⏹ Stop</button>
        <button class="cbtn reset"
          onclick="cronoReset('${key}')">↺ Reset</button>
      </div>
      <div class="crono-tempos">
        <span><span id="csessao-${key}">0min</span><strong>Sessão</strong></span>
        <span><span id="cacum-${key}">${fmtTempoLeg(acum)}</span><strong>Total</strong></span>
      </div>
    </div>

    <div class="mat-status">
      <button class="msb ${st==='andamento'?'on':''}"
        onclick="selMatSt('${tid}','${topId}','${m.id}','andamento',this)">Em andamento</button>
      <button class="msb ${st==='concluido'?'on':''}"
        onclick="selMatSt('${tid}','${topId}','${m.id}','concluido',this)">Concluído</button>
      <button class="msb ${st==='pulei'?'on':''}"
        onclick="selMatSt('${tid}','${topId}','${m.id}','pulei',this)">Pulei</button>
    </div>
    ${pagField}
    <textarea class="mat-coment" id="cm-${key}"
      placeholder="Dúvidas, anotações, nº questão TEC...">${cm}</textarea>
    <button class="mat-salvar" onclick="salvarMat('${tid}','${topId}','${m.id}')">Salvar</button>
    <div class="mat-msg" id="mg-${key}">Salvo!</div>
    <div class="autosave-ind" id="as-${key}">✓ auto-salvo</div>
  </div>`;
}

function top_key(topId,matId){return `${topId}_${matId}`;}

// ── Sync página híbrida ───────────────────────────────────────────────────────
function syncPagInput(key){
  const sel=document.getElementById(`pgsel-${key}`);
  const inp=document.getElementById(`pg-${key}`);
  if(sel&&inp&&sel.value) inp.value=sel.value;
}
function syncPagSelect(key){
  const sel=document.getElementById(`pgsel-${key}`);
  const inp=document.getElementById(`pg-${key}`);
  if(sel&&inp){
    const opts=[...sel.options];
    const match=opts.find(o=>o.value==inp.value);
    sel.value=match?inp.value:'';
  }
}

// ── Toggle tópico ─────────────────────────────────────────────────────────────
function togTopico(topId,tid){
  const body=document.getElementById(`tb-${topId}`);
  const chev=document.getElementById(`tch-${topId}`);
  if(!body)return;
  const ab=body.style.display==='block';
  if(aberto.item&&aberto.item!==topId){
    const ob=document.getElementById(`tb-${aberto.item}`);
    const oc=document.getElementById(`tch-${aberto.item}`);
    if(ob)ob.style.display='none';
    if(oc)oc.classList.remove('ab');
  }
  body.style.display=ab?'none':'block';
  chev.classList.toggle('ab',!ab);
  aberto.item=ab?null:topId;
  if(!ab)body.parentElement.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function selMatSt(tid,topId,matId,val,btn){
  btn.closest('.mat-status').querySelectorAll('.msb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const key=top_key(topId,matId);
  if(!stSel[tid])stSel[tid]={};
  stSel[tid][key]=val;
}

// ── Salvar material ───────────────────────────────────────────────────────────
async function salvarMat(tid,topId,matId,autoStop=false,silent=false){
  const key=top_key(topId,matId);
  const pg=parseInt(document.getElementById(`pg-${key}`)?.value)||0;
  const cm=document.getElementById(`cm-${key}`)?.value||'';
  const st=stSel[tid]?.[key]||getSt(tid,key)||'andamento';
  const c=getCrono(key);
  const acum=c.acumulado+getAcum(tid,key);

  if(!prog[tid])prog[tid]={};
  prog[tid][key]={status:st,pagina_atual:pg,comentario:cm,tempo_acumulado:acum};

  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({
      action:'save',trilha_id:tid,aula_num:key,
      status:st,pag_atual:pg,topicos_cobertos:[],comentario:cm,tempo_acumulado:acum
    })});
  }catch(e){}

  if(!silent){
    const mg=document.getElementById(`mg-${key}`);
    if(mg){mg.style.display='block';setTimeout(()=>mg.style.display='none',1800);}
  } else {
    const as=document.getElementById(`as-${key}`);
    if(as){as.style.display='block';setTimeout(()=>as.style.display='none',2000);}
  }

  // Atualiza status do tópico
  const top=TB[tid]?.topicos?.find(t=>t.id===topId);
  if(top){
    const nOk=(top.materiais||[]).filter(m=>getSt(tid,top_key(top.id,m.id))==='concluido').length;
    const stTop=nOk===(top.materiais||[]).length&&(top.materiais||[]).length>0?'ok':nOk>0?'and':'';
    const dot=document.querySelector(`#ti-${topId} .topico-status`);
    const sub=document.querySelector(`#ti-${topId} .topico-sub`);
    if(dot) dot.className='topico-status '+stTop;
    if(sub) sub.textContent=`${nOk}/${(top.materiais||[]).length} materiais`;
  }

  // Atualiza progresso geral
  const p=calcProgresso(tid);
  const pf=document.getElementById('tPF');
  const pt=document.getElementById('tPT');
  if(pf) pf.style.width=p.pct+'%';
  if(pt) pt.textContent=p.pct+'%';

  // Atualiza meta semanal
  renderMetaSemanal(tid);
}

// ── Modo módulos (T1) ─────────────────────────────────────────────────────────
function renderAulaHTML(tid,a){
  const st=getSt(tid,a.num),mn=getPag(tid,a.num);
  const nc=st==='concluida'?'ok':st==='andamento'?'and':(a.tipo==='questoes'?'q':'');
  const tit=(a.titulo||[])[0]||`Aula ${a.num}`;
  const numDisp=String(a.num).includes('-')?String(a.num).split('-')[1]:a.num;
  const sub=mn>0?`min. ${mn}`:(a.duracao||'');
  const tbg=a.tipo==='questoes'?'tb-q':'tb-t';
  const tbl=a.tipo==='questoes'?'questões':'teoria';
  return `<div class="aula" id="aula-${a.num}">
    <div class="aula-hdr" onclick="togAula('${a.num}','${tid}')">
      <div class="anum ${nc}">${numDisp}</div>
      <div class="aula-info">
        <div class="atit">${tit}</div>
        <div class="asub"><span class="tbadge ${tbg}">${tbl}</span><span>${sub}</span></div>
      </div>
      <span class="achev" id="ach-${a.num}">&#8250;</span>
    </div>
    <div class="apanel" id="ap-${a.num}">
      <div class="campo"><div class="clbl">Duração</div><div class="cval">${a.duracao||'—'}</div></div>
      <div class="reg">
        <div class="reg-t">Registrar progresso</div>
        <div class="rg"><div class="rl">Status</div>
          <div class="ro">
            <button class="rb ${st==='andamento'?'on':''}"
              onclick="selSt('${tid}','${a.num}','andamento',this)">Em andamento</button>
            <button class="rb ${st==='concluida'?'on':''}"
              onclick="selSt('${tid}','${a.num}','concluida',this)">Concluída</button>
            <button class="rb ${st==='pulei'?'on':''}"
              onclick="selSt('${tid}','${a.num}','pulei',this)">Pulei</button>
          </div>
        </div>
        <div class="rg"><div class="rl">Minuto atual</div>
          <div class="mr"><input type="number" id="mn-${a.num}" value="${mn}" min="0" placeholder="0">
          <span style="font-size:11px;color:#666">de ${a.duracao||'?'}</span></div>
        </div>
        <div class="rg"><div class="rl">Comentários</div>
          <textarea class="ca" id="cm-${a.num}"
            placeholder="Dúvidas, anotações, nº questão TEC...">${getCm(tid,a.num)}</textarea>
        </div>
        <button class="bsalvar" onclick="salvar('${tid}','${a.num}')">Salvar</button>
        <div class="msg" id="mg-${a.num}">Salvo!</div>
      </div>
    </div>
  </div>`;
}

function togGrupo(gid){
  const body=document.getElementById(`gb-${gid}`);
  const chev=document.getElementById(`gchev-${gid}`);
  if(!body)return;
  const ab=body.style.display==='block';
  if(aberto.grupo&&aberto.grupo!==gid){
    const ob=document.getElementById(`gb-${aberto.grupo}`);
    const oc=document.getElementById(`gchev-${aberto.grupo}`);
    if(ob)ob.style.display='none';
    if(oc)oc.classList.remove('ab');
    aberto.item=null;
  }
  body.style.display=ab?'none':'block';
  chev.classList.toggle('ab',!ab);
  aberto.grupo=ab?null:gid;
  if(!ab)body.parentElement.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function togAula(n,tid){
  const ap=document.getElementById(`ap-${n}`);
  const ac=document.getElementById(`ach-${n}`);
  if(!ap)return;
  const ab=ap.style.display==='block';
  if(aberto.item&&aberto.item!==n){
    const oap=document.getElementById(`ap-${aberto.item}`);
    const oac=document.getElementById(`ach-${aberto.item}`);
    if(oap)oap.style.display='none';
    if(oac)oac.classList.remove('ab');
  }
  ap.style.display=ab?'none':'block';
  ac.classList.toggle('ab',!ab);
  aberto.item=ab?null:n;
  if(!ab)ap.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function selSt(tid,n,val,btn){
  btn.closest('.ro').querySelectorAll('.rb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(!stSel[tid])stSel[tid]={};
  stSel[tid][n]=val;
}

async function salvar(tid,n){
  const mn=parseInt(document.getElementById(`mn-${n}`)?.value)||0;
  const cm=document.getElementById(`cm-${n}`)?.value||'';
  const st=stSel[tid]?.[n]||getSt(tid,n)||'andamento';
  if(!prog[tid])prog[tid]={};
  prog[tid][n]={status:st,pagina_atual:mn,comentario:cm,tempo_acumulado:0};
  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({
      action:'save',trilha_id:tid,aula_num:n,status:st,
      pag_atual:mn,topicos_cobertos:[],comentario:cm
    })});
  }catch(e){}
  const mg=document.getElementById(`mg-${n}`);
  if(mg){mg.style.display='block';setTimeout(()=>mg.style.display='none',1800);}
  const p=calcProgresso(tid);
  const pf=document.getElementById('tPF');
  const pt=document.getElementById('tPT');
  if(pf)pf.style.width=p.pct+'%';
  if(pt)pt.textContent=p.pct+'%';
  const an=document.querySelector(`#aula-${n} .anum`);
  if(an)an.className='anum'+(st==='concluida'?' ok':st==='andamento'?' and':'');
  const t=TB[tid];
  if(t&&t.modulos){
    const a=(t.aulas||[]).find(x=>x.num===n);
    if(a){
      const mod=t.modulos.find(m=>m.id===a.modulo_id);
      if(mod){
        const aulasG=(t.aulas||[]).filter(x=>x.modulo_id===mod.id);
        const ok=aulasG.filter(x=>getSt(tid,x.num)==='concluida').length;
        const pct=Math.round(ok/mod.n_aulas*100);
        const gs=document.getElementById(`gsub-${mod.id}`);
        if(gs)gs.textContent=`${ok}/${mod.n_aulas} aulas · ${pct}%`;
      }
    }
  }
}

// ── Fase 2 ────────────────────────────────────────────────────────────────────
function renderFase2(tid){
  const t=TB[tid];
  const cf=document.getElementById('tcontent');
  if(!t.fase2_desbloqueada){
    cf.innerHTML=`<div class="f2panel"><div class="f2lock">
      <div class="f2icon">&#128274;</div>
      <div class="f2txt">Fase de exercícios bloqueada.<br>Avance quando se sentir pronto.</div>
      <button class="bunlock" onclick="desbloquear('${tid}')">Avançar para Fase 2</button>
    </div></div>`;
    return;
  }
  const mods=t.modulos&&t.modulos.length>0?t.modulos:
    (t.topicos||[]).slice(0,10).map(tp=>({id:tp.id,nome:tp.topico}));
  let html='<div class="f2panel">';
  html+=`<p style="font-size:12px;color:#666;margin-bottom:12px;line-height:1.6">
    Acesse o <strong>TEC Concursos</strong>, filtre por <strong>FCC + tópico</strong> e registre seu desempenho.</p>`;
  mods.forEach(mod=>{
    html+=`<div class="teccard">
      <div class="tectit">${mod.nome}</div>
      <div class="clbl" style="margin-bottom:3px">Busca no TEC</div>
      <div class="tecbusca">FCC | ${mod.nome.substring(0,40)}</div>
      <div class="rl" style="margin-top:6px">Desempenho</div>
      <div class="trow">
        <div><input class="tinput" type="number" id="qt-${tid}-${mod.id}"
          placeholder="0" min="0" oninput="calcPerc('${tid}','${mod.id}')">
          <div class="tlbl">Feitas</div></div>
        <div><input class="tinput" type="number" id="qa-${tid}-${mod.id}"
          placeholder="0" min="0" oninput="calcPerc('${tid}','${mod.id}')">
          <div class="tlbl">Acertos</div></div>
        <div><input class="tinput" type="number" id="qp-${tid}-${mod.id}"
          placeholder="0" readonly style="background:#f5f5f5">
          <div class="tlbl">%</div></div>
      </div>
    </div>`;
  });
  html+=`<button class="bsalvar" onclick="salvarF2()">Salvar</button>
    <div class="msg" id="mg-f2">Salvo!</div></div>`;
  cf.innerHTML=html;
}

function calcPerc(tid,mid){
  const qt=parseInt(document.getElementById(`qt-${tid}-${mid}`)?.value)||0;
  const qa=parseInt(document.getElementById(`qa-${tid}-${mid}`)?.value)||0;
  const qp=document.getElementById(`qp-${tid}-${mid}`);
  if(qp)qp.value=qt>0?Math.round(qa/qt*100):0;
}

function desbloquear(tid){
  if(!confirm('Confirma avançar para a Fase 2?'))return;
  TB[tid].fase2_desbloqueada=true;
  document.getElementById('tabF2').className='tab';
  mudarFase(2);
}

async function salvarF2(){
  const mg=document.getElementById('mg-f2');
  if(mg){mg.style.display='block';setTimeout(()=>mg.style.display='none',1800);}
}

function voltarHome(){
  if(autoSaveInterval){clearInterval(autoSaveInterval);autoSaveInterval=null;}
  document.getElementById('telaHome').style.display='block';
  document.getElementById('telaTrilha').style.display='none';
  document.getElementById('btnV').style.display='none';
  document.getElementById('hT').textContent='Trilhas ICMS-BA 2026';
  document.getElementById('hS').textContent='Fase de estudo \u00b7 '+Object.keys(TB).length+' trilhas';
  trilhaAtual=null;renderHome();
}

init();
</script>
